# Hər gün 06:00 (Bakı vaxtı) Claude ssenari yazır, iki video hazırlanır (az + en),
# Claude hazır videonun kadrlarını yoxlayır, yalnız yoxlamadan keçən video GitHub Pages-ə qoyulur.
# Make.com 08:00-da latest.json-u oxuyub paylaşır.
name: Daily video

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 06:00 Bakı
  workflow_dispatch: # Actions səhifəsindən əl ilə işə salmaq üçün
    inputs:
      publish:
        description: 'Publish (off = test only: videos are made and checked, but not published)'
        type: boolean
        default: false

permissions:
  contents: write # history.json-u yadda saxlamaq üçün
  pages: write
  id-token: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare video browser
        run: npx remotion browser ensure

      - id: pages
        uses: actions/configure-pages@v5

      - name: Write script, render videos, check quality
        run: node daily.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      # Sınaq üçün: videolar və yoxlama kadrları Actions səhifəsində yüklənə bilər
      - name: Keep videos and check frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-and-checks
          path: |
            site
            qa
          retention-days: 7

      - if: github.event_name == 'schedule' || inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/deploy-pages@v4

      # Mövzu tarixçəsi yadda qalır (təkrar olmasın). Həm də repo "aktiv" qalır:
      # GitHub 60 gün dəyişiklik olmayan repolarda planlı işləri dayandırır.
      - name: Save topic history
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git config user.name "rezet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Video $(date -u +%F)" || echo "No change"
          git push
